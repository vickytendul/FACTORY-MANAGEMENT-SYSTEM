name: Keep Render backend warm

# Render's free/sleep-enabled tier spins the service down after ~15 minutes
# of inactivity; the next request then pays a cold-start cost that can run
# up to roughly a minute. Pinging a lightweight, unauthenticated,
# no-op endpoint well under that window keeps the instance warm so a real
# user's login never has to pay that cold-start cost. This does not touch
# authentication, authorization, or any business logic - it only prevents
# the backend process from ever going idle long enough to sleep.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://factory-management-system-09et.onrender.com/test
